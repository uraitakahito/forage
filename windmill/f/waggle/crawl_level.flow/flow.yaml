summary: クロール 1 段
description: |
  waggle が投げた 1 段を処理して報告する。

  この flow は **1 段で終わる**。次の段を起こすのは waggle —— Windmill の while ループに
  繰り返しを持たせようとしたが、stop_after_if を付けた最小の flow が 643 回まで回り続けた
  (実測)。相手のサーバに負荷をかけない仕組みを、暴走しうるループの上には載せない。

  礼儀はこの flow の形で守る:
    - ホストで束ねる            (plan_level)
    - ホストを並列に回す        for-loop の parallelism —— CE で効く唯一の同時実行の枠
    - ホスト内は逐次 + 間隔     (crawl_host)

  報告のあとに索引を 1 段だけ足してある。載せる中身を選ぶのは waggle で、ここが渡すのは
  crawl_id だけ —— 判断を、単体試験の無い場所に置かないため。

  Windmill の per-key concurrency limit は使わない。実装が jobs_ee.rs にあり、
  Community Edition では常に許可を返すスタブなので、**設定しても無言で素通しになる**。
value:
  modules:
    - id: plan
      summary: ホストで束ね、robots を見る
      value:
        type: script
        path: f/waggle/plan_level
        input_transforms:
          candidates:
            type: javascript
            expr: flow_input.frontier
          per_host_delay_ms:
            type: javascript
            expr: flow_input.per_host_delay_ms
          respect_robots:
            type: javascript
            expr: flow_input.respect_robots
    - id: hosts
      summary: ホストごとに並列、ホスト内は逐次
      value:
        type: forloopflow
        modules:
          - id: cap
            value:
              type: script
              path: f/waggle/crawl_host
              input_transforms:
                crawl_id:
                  type: javascript
                  expr: flow_input.crawl_id
                host:
                  type: javascript
                  expr: flow_input.iter.value.host
                urls:
                  type: javascript
                  expr: flow_input.iter.value.urls
                per_host_delay_ms:
                  type: javascript
                  expr: flow_input.iter.value.delayMs
                initial_delay_ms:
                  type: javascript
                  expr: flow_input.iter.value.initialDelayMs
                capture_formats:
                  type: javascript
                  expr: flow_input.capture_formats
                signing:
                  type: javascript
                  expr: flow_input.signing
                artifact_sink:
                  type: javascript
                  expr: flow_input.artifact_sink
        iterator:
          type: javascript
          expr: results.plan.groups
        parallel: true
        parallelism:
          type: javascript
          expr: flow_input.host_parallelism
        skip_failures: false
    - id: report
      summary: waggle に報告する
      value:
        type: script
        path: f/waggle/report_level
        input_transforms:
          crawl_id:
            type: javascript
            expr: flow_input.crawl_id
          depth:
            type: javascript
            expr: flow_input.depth
          results:
            type: javascript
            expr: |-
              results.hosts.flat().concat(
                results.plan.skipped.map((s) => ({ url: s.url, status: "skipped", skipReason: s.reason }))
              )
    - id: index
      summary: 索引に載せる
      value:
        type: script
        path: f/waggle/index_level
        input_transforms:
          crawl_id:
            type: javascript
            expr: flow_input.crawl_id
  # **段が落ちたときに走る。** flow が途中で死ぬと report まで辿り着かないので、
  # waggle は何も知らされず `crawls` の行が `running` のまま残る —— 部分 unique index が
  # 以後のクロールを全部塞ぐ。実測で踏んだ (BrowserHive を止めたクロールが永久に走行中)。
  #
  # `error` は Windmill が failure_module にだけ渡す特別な入力。
  failure_module:
    id: failure
    value:
      type: script
      path: f/waggle/fail_crawl
      input_transforms:
        crawl_id:
          type: javascript
          expr: flow_input.crawl_id
        error:
          type: javascript
          expr: error

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - crawl_id
    - depth
    - frontier
    - per_host_delay_ms
    - host_parallelism
    - respect_robots
    - capture_formats
    - signing
  properties:
    crawl_id:
      type: string
      description: waggle が発行したクロールの id
    depth:
      type: integer
      description: この段の深さ。種が 0
      minimum: 0
    frontier:
      type: array
      description: この段で取る URL
      items:
        type: object
        properties:
          host:
            type: string
          url:
            type: string
    host_parallelism:
      type: integer
      description: 同時に触ってよいホストの数
      default: 4
    per_host_delay_ms:
      type: integer
      description: 同じホストへ、完了から次の投入まで空ける時間
      default: 2000
    respect_robots:
      type: boolean
      description: robots.txt を尊重するか
      default: true
    capture_formats:
      type: object
      description: 取り込む形式。waggle が決めて必ず送る（既定値には頼れない）
      properties:
        png:
          type: boolean
        webp:
          type: boolean
        html:
          type: boolean
        links:
          type: boolean
        mhtml:
          type: boolean
        wacz:
          type: boolean
    signing:
      type: boolean
      description: WACZ に署名するか。waggle が決めて必ず送る
    artifact_sink:
      # 成果物の送り先。**必須にしない** —— 省けば BrowserHive は従来どおり自前の
      # 保管庫へ書くので、2 つの経路が同時に生きる。切り替えを 1 本のクロールから
      # 始められるのが、この省略可能性の狙い。
      type: object
      description: 成果物の押し出し先。waggle が crawl ごとに 1 回きりの口を発行する
      properties:
        url:
          type: string
        token:
          type: string
  # waggle が送るのは crawl_id / depth / frontier / 間隔 / 並列度 /
  # capture_formats / signing の 7 つだけ。
  # waggle は自分がコンテナからどう見えるかを知らないし、issuer の鍵も持っていない。
  #
  # **下の default は webhook からの実行では埋まらない。** 実測: 必須の引数だけ渡して
  # 起こすと、host_parallelism も respect_robots も「渡されていない」まま届く。
  # 既定値が埋まるのは UI からの実行だけ。
  #
  # つまり respect_robots は **常に null で届く**。robots を守っているのは
  # plan_level.ts の `?? true` **1 か所だけ**で、ここの default ではない。
  # 消すと robots が黙って無視される (test/plan-level.test.ts と
  # test/e2e/crawl-level.e2e.test.ts の両方が赤くなる)。
  required:
    - crawl_id
    - depth
    - frontier
    # **形式と署名は必須。** 既定値は webhook 起動では埋まらないので、
    # 省略できる形にすると「渡し忘れ」が黙って別の形式で走ることになる。
    - capture_formats
    - signing
